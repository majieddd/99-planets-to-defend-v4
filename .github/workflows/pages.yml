name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: Branch to publish under /preview/ beside main (type none to skip the preview)
        required: false
        default: m1-combat-feel-wip

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A build or deploy that hangs would otherwise hold a runner for GitHub's 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The project's one Node version source, as in ci.yml.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          P99_BASE: /99-planets-to-defend-v4/
      # The owner tests work in progress from any device, so one unmerged branch is also built under
      # /preview/. Pages serves a single site per repository, which is why the preview rides inside
      # main's deployment instead of deploying on its own. A push to main uses the PAGES_PREVIEW_REF
      # repository variable, or the default below; a manual run can name any branch, or none.
      - name: Resolve the preview branch
        id: preview
        env:
          INPUT_REF: ${{ inputs.preview_ref }}
          VAR_REF: ${{ vars.PAGES_PREVIEW_REF }}
        run: |
          ref="${INPUT_REF:-${VAR_REF:-m1-combat-feel-wip}}"
          if [ "$ref" = "none" ]; then
            echo "Preview skipped on request."
            echo "ref=" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$ref" > /dev/null; then
            echo "Publishing $ref under /preview/."
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            # A merged or deleted preview branch must not fail main's deployment.
            echo "Preview branch $ref does not exist; main deploys without a preview."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.preview.outputs.ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.ref }}
          path: preview-src
      - if: steps.preview.outputs.ref != ''
        working-directory: preview-src
        run: npm ci
      # Built after main, because main's build empties dist and would delete the preview.
      - if: steps.preview.outputs.ref != ''
        working-directory: preview-src
        run: npx vite build --outDir ../dist/preview --emptyOutDir
        env:
          P99_BASE: /99-planets-to-defend-v4/preview/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
